# The staging demo reset: wipes every account and case folder (testers get a fresh synthetic demo taxpayer at their
# next sign-in). A template only: suspended, it never runs on a schedule. scripts/release/stage.sh (app repo) runs
# it after each staging deploy with
#   kubectl --context homelab -n blockone-staging create job --from=cronjob/blockone-demo-reset demo-reset-<sha>
# The app refuses the reset unless BLOCKONE_WEB_SITE_MODE=staging and the data root carries the staging marker
# (or is empty), so even pointed at production's volume it would delete nothing.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: blockone-demo-reset
  labels:
    app: blockone-demo-reset
spec:
  suspend: true
  schedule: "0 0 1 1 *" # never used while suspended
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2 # a new pod's NetworkPolicy can take a few seconds to apply: a refused connection retries
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: blockone-demo-reset
            blockone-db-client: "true" # may reach PostgreSQL (networkpolicy.yaml in the base)
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          imagePullSecrets:
            - name: ghcr-pull
          nodeSelector:
            kubernetes.io/hostname: minisrv01 # the data volume lives here
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reset
              image: ghcr.io/turpinator-x/blockone-crypto-tax
              args: ["demo-reset"]
              envFrom:
                - configMapRef:
                    name: blockone-settings
                - secretRef:
                    name: blockone-app
                - secretRef:
                    name: blockone-staging-keys
              env:
                - name: BLOCKONE_WEB_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: blockone-db
                      key: password
                - name: BLOCKONE_WEB_DATABASE_URL
                  value: postgresql+psycopg://blockone:$(BLOCKONE_WEB_DB_PASSWORD)@blockone-postgres:5432/blockone
              resources:
                requests:
                  cpu: 10m
                  memory: 96Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: blockone-data
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
---
# The reset reaches DNS and PostgreSQL only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: blockone-demo-reset
spec:
  podSelector:
    matchLabels:
      app: blockone-demo-reset
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: blockone-postgres
      ports:
        - port: 5432
          protocol: TCP
