# Alerts for the nightly Linkding and Audiobookshelf backups, from kube-state-metrics' CronJob and Job metrics.
# The label is what this Prometheus's ruleSelector matches. Tests: tests/rules.test.yaml.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: app-backup
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: app-backup
      rules:
        - alert: AppBackupStale
          # Nightly jobs: more than 26 hours since the last success means last night's run didn't succeed
          expr: |
            time() - kube_cronjob_status_last_successful_time{namespace=~"linkding|audiobookshelf", cronjob=~"(linkding|audiobookshelf)-backup"} > 26 * 3600
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.cronjob }} has not succeeded for more than 26 hours"
            runbook: docs/backups.md (Alerts)
        - alert: AppBackupNeverSucceeded
          # The metric above only exists after a first success
          expr: |
            (time() - kube_cronjob_created{namespace=~"linkding|audiobookshelf", cronjob=~"(linkding|audiobookshelf)-backup"} > 26 * 3600)
            unless on (namespace, cronjob) kube_cronjob_status_last_successful_time
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.cronjob }} has existed for 26 hours without one successful run"
            runbook: docs/backups.md (Alerts)
        - alert: AppBackupMissing
          # A deleted or pruned CronJob has no metrics, so the two rules above would stay quiet
          expr: |
            absent(kube_cronjob_created{namespace="linkding", cronjob="linkding-backup"})
            or absent(kube_cronjob_created{namespace="audiobookshelf", cronjob="audiobookshelf-backup"})
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "The backup CronJob {{ $labels.cronjob }} does not exist (or its metrics are gone)"
            runbook: docs/backups.md (Alerts)
        - alert: AppBackupJobFailed
          # A run that failed (after its one retry), shown for a day so a later success doesn't hide it at once
          expr: |
            kube_job_failed{namespace=~"linkding|audiobookshelf", job_name=~"(linkding|audiobookshelf)-backup-.+", condition="true"} == 1
            and on (namespace, job_name) (time() - kube_job_created < 24 * 3600)
          labels:
            severity: warning
          annotations:
            summary: "Backup job {{ $labels.job_name }} failed"
            description: "kubectl --context homelab -n {{ $labels.namespace }} logs job/{{ $labels.job_name }} --all-containers"
            runbook: docs/backups.md (Alerts)
