apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: linkding
resources:
  - ../../base/linkding/
  - ../../base/app-backup/
  - cloudflare.yaml
  - cloudflare-secret.yaml
  - linkding-container-env-secret.yaml
  - ingress.yaml
  - backup.yaml
  - linkding-backup-secret.yaml
configMapGenerator:
  - name: linkding-configmap
    literals:
      - LD_CSRF_TRUSTED_ORIGINS=https://linkding.jarrodturpin.dev
