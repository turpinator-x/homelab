apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: blockone-crypto-tax
resources:
  - ../../base/blockone-crypto-tax/
  - cloudflare.yaml
  # SOPS-encrypted Secrets (made from the .example files next to them; steps: docs/blockone-crypto-tax.md)
  - tunnel-credentials-secret.yaml
  - blockone-db-secret.yaml
  - blockone-app-secret.yaml
  - blockone-explorer-keys-secret.yaml
  - ghcr-pull-secret.yaml
  # Nightly backups' R2 keys and crypt passwords: uncomment once the files exist (docs/blockone-crypto-tax.md,
  # "Backups and restore"). Until then the backup pods wait in CreateContainerConfigError and the alerts fire.
  - blockone-backup-secret.yaml
  - blockone-backup-mirror-secret.yaml
  # RESTORE ONLY (docs/blockone-crypto-tax.md, "Backups and restore"): uncomment with the patch below, then
  # comment both out again once the restore is checked.
  # - restore.yaml
# patches:
#   # Stops the API and worker while a restore runs, so nothing writes to the database or case files
#   - target: {kind: Deployment, name: "blockone-(api|worker)"}
#     patch: |-
#       - op: replace
#         path: /spec/replicas
#         value: 0
images:
  # Built by turpinator-x/blockone-crypto-tax's image workflow (linux/amd64 + linux/arm64).
  # Built from the app repo's main bd877bb: fix(engine): one time zone decides every row's tax year; year-ends written once
  - name: ghcr.io/turpinator-x/blockone-crypto-tax
    newTag: sha-bd877bb9c810d9e158863bd5d1a3e71f55f7f193
    digest: sha256:18c9427e1e97c978c3be14193fe2f84d22484485cf33b1f7521fc2c517a441ab
