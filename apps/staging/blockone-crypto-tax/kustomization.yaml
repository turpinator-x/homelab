  # Built from the app repo's main 60bf145: Merge pull request #61 from turpinator-x/feat/token-classification
  - name: ghcr.io/turpinator-x/blockone-crypto-tax
    newTag: sha-60bf1456f0384d105da4ed24d9b4e70912e0f6d0
