# RESTORE, run on purpose only. Not applied until its line in kustomization.yaml is uncommented, together with
# the scale-to-zero patch there. Steps: docs/blockone-crypto-tax.md ("Backups and restore"); the app repo's
# scripts/release/rollback.sh makes the same edits through PRs.
#
# Puts one night's backup back: downloads and decrypts it from R2 with the mirror's read-only token, replaces
# the database's whole schema with the backup's in a single transaction (all or nothing), unpacks the backup's case files
# next to the live ones, then moves the live ones aside to /data/.pre-restore-<time> (same volume, nothing is
# deleted) and the restored ones into place. Both files are checked before anything is changed.
# A Job can't be changed once created: to run it again, change the name (or remove it, let Flux prune it, and
# add it back).
apiVersion: batch/v1
kind: Job
metadata:
  name: blockone-restore
  labels:
    app: blockone-restore
spec:
  backoffLimit: 0 # a failed restore is looked at, not retried
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app: blockone-backup # the backup's NetworkPolicy: PostgreSQL, DNS and HTTPS to public addresses
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: minisrv01 # blockone-data is a node-local volume
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fetch
          image: rclone/rclone:1.76.0@sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              day=$(echo "$BACKUP" | sed -E 's/^([0-9]{4})([0-9]{2})([0-9]{2})T.*/\1\/\2\/\3/')
              rclone copyto "backup:$day/blockone-db-$BACKUP.dump" /work/blockone-db.dump -v
              rclone copyto "backup:$day/blockone-data-$BACKUP.tar.gz" /work/blockone-data.tar.gz -v
          env:
            - name: BACKUP # the stamp in the file names, e.g. 20261112T113000Z (list them: see the docs)
              value: REPLACE_ME
            - name: R2_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: blockone-backup-mirror # the read-only token: a restore can't change the backups
                  key: R2_ENDPOINT
            - name: R2_BUCKET
              valueFrom:
                secretKeyRef:
                  name: blockone-backup-mirror
                  key: R2_BUCKET
            - name: RCLONE_CONFIG_R2_TYPE
              value: s3
            - name: RCLONE_CONFIG_R2_PROVIDER
              value: Cloudflare
            - name: RCLONE_CONFIG_R2_ENDPOINT
              value: $(R2_ENDPOINT)
            - name: RCLONE_CONFIG_R2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: blockone-backup-mirror
                  key: R2_ACCESS_KEY_ID
            - name: RCLONE_CONFIG_R2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: blockone-backup-mirror
                  key: R2_SECRET_ACCESS_KEY
            - name: RCLONE_CONFIG_R2_NO_CHECK_BUCKET
              value: "true"
            - name: RCLONE_CONFIG_BACKUP_TYPE
              value: crypt
            - name: RCLONE_CONFIG_BACKUP_REMOTE
              value: r2:$(R2_BUCKET)/blockone
            - name: RCLONE_CONFIG_BACKUP_FILENAME_ENCRYPTION
              value: standard
            - name: RCLONE_CONFIG_BACKUP_DIRECTORY_NAME_ENCRYPTION
              value: "true"
            - name: RCLONE_CONFIG_BACKUP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: blockone-backup-mirror
                  key: RCLONE_CRYPT_PASSWORD
            - name: RCLONE_CONFIG_BACKUP_PASSWORD2
              valueFrom:
                secretKeyRef:
                  name: blockone-backup-mirror
                  key: RCLONE_CRYPT_PASSWORD2
            - name: HOME
              value: /tmp
            - name: XDG_CONFIG_HOME
              value: /tmp/.config
            - name: RCLONE_CACHE_DIR
              value: /tmp/.cache
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
        - name: database
          image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              # Both files must read cleanly before anything is changed
              pg_restore --list /work/blockone-db.dump > /dev/null
              tar -tzf /work/blockone-data.tar.gz > /dev/null
              # The dump as SQL first, so a dump that can't be read in full never reaches the database. Then the
              # whole schema is dropped and rebuilt from it in ONE transaction: unlike `pg_restore --clean`, which
              # drops only what the dump has, this also removes what a newer release added (a table with a foreign
              # key on taxpayers made --clean fail and roll back). Any error rolls everything back, DROP included.
              # Same commands as the app repo's tests/unit/web/test_migration_policy.py (RESTORE_STEPS), which
              # restores an N-1 dump over an N schema on PostgreSQL 18 in CI.
              # The schema is recreated as a new database has it (owner pg_database_owner, USAGE for PUBLIC). The
              # plaintext SQL file is removed however this step ends.
              trap 'rm -f /work/blockone-db.sql' EXIT
              pg_restore --no-owner -f /work/blockone-db.sql /work/blockone-db.dump
              { printf '%s\n' 'DROP SCHEMA public CASCADE;' 'CREATE SCHEMA public;' \
                  'ALTER SCHEMA public OWNER TO pg_database_owner;' 'GRANT USAGE ON SCHEMA public TO PUBLIC;'
                cat /work/blockone-db.sql; } \
                | psql -h blockone-postgres -U blockone -d blockone -v ON_ERROR_STOP=1 --single-transaction -q
              echo "database restored"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: blockone-db
                  key: password
            - name: PGCONNECT_TIMEOUT
              value: "10"
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: work
              mountPath: /work # writable: the dump is written out as SQL here first
            - name: tmp
              mountPath: /tmp
      containers:
        - name: case-files
          image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              # Unpack next to the live files first, so a failure here leaves them untouched. (Unpacking
              # straight into /data fails: tar can't change the mode of the volume's root, which it doesn't own.)
              stamp=$(date -u +%Y%m%dT%H%M%SZ)
              mkdir "/data/.restoring-$stamp"
              tar -C "/data/.restoring-$stamp" -xzf /work/blockone-data.tar.gz
              # Then swap: the current files go aside (same volume, nothing is deleted), the restored ones in
              aside="/data/.pre-restore-$stamp"
              mkdir "$aside"
              find /data -mindepth 1 -maxdepth 1 ! -name 'lost+found' ! -name '.pre-restore-*' \
                ! -name ".restoring-$stamp" -exec mv -t "$aside" {} +
              find "/data/.restoring-$stamp" -mindepth 1 -maxdepth 1 -exec mv -t /data {} +
              rmdir "/data/.restoring-$stamp"
              echo "case files restored; the previous ones are in $aside (delete it once the restore is checked)"
          env:
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: work
              mountPath: /work
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: blockone-data
        - name: work
          emptyDir:
            sizeLimit: 8Gi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
