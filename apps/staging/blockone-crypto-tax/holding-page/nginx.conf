# nginx for the blockproof.tax holding page (holding-page.yaml). Static files only, no proxying. The image is
# nginx-unprivileged, run read-only: every temp file goes under /tmp (an emptyDir).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events {
  worker_connections 64;
}
http {
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-store" always;
    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }
    location = /robots.txt {
      default_type text/plain;
      return 200 "User-agent: *\nDisallow: /\n";
    }
    location / {
      default_type text/html;
      try_files /index.html =404;
    }
  }
}
