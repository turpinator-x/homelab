# Forgejo trial (docs/forgejo.md). Rootless image, SQLite, one replica. AI-assisted (Claude Code).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  labels:
    app: forgejo
spec:
  replicas: 1
  strategy:
    type: Recreate # two copies must never share the SQLite database
  selector:
    matchLabels:
      app: forgejo
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false # a Service named forgejo would otherwise add FORGEJO_* variables
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:15.0.12-rootless@sha256:b670d7724274e1d5c7801b76017b7267e6e5432aa4fe8bed49f781d09476b9dd
          # The image's entrypoint still runs first; the wrapper then runs Forgejo and pauses it for backups.
          args: ["sh", "/supervise/supervise.sh", "/usr/local/bin/gitea", "-c", "/var/lib/gitea/custom/conf/app.ini", "web"]
          ports:
            - { name: http, containerPort: 3000 }
          envFrom:
            - configMapRef:
                name: forgejo-settings
          startupProbe:
            httpGet: { path: /api/healthz, port: http }
            periodSeconds: 5
            failureThreshold: 60 # first start and upgrades migrate the database
          readinessProbe:
            httpGet: { path: /api/healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            # Healthy, or stopped on purpose for a backup
            exec:
              command: [sh, -c, "test -f /var/lib/gitea/backup-control/paused || wget -q -T 5 -O /dev/null http://127.0.0.1:3000/api/healthz"]
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/gitea }
            - { name: tmp, mountPath: /tmp }
            - { name: supervise, mountPath: /supervise, readOnly: true }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
        - name: supervise
          configMap:
            name: forgejo-supervise
