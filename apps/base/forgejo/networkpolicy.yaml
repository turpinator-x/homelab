# Only Traefik may connect to Forgejo, and Forgejo may connect to nothing: the trial needs no outbound traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forgejo
spec:
  podSelector:
    matchLabels:
      app: forgejo
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - { port: 3000, protocol: TCP }
  egress: []
