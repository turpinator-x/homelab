apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: linkding
  name: linkding
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linkding
  template:
    metadata:
      labels:
        app: linkding
    spec:
      securityContext:
        fsGroup: 33 # www-data group ID
        runAsUser: 33 # www-data user ID
        runAsGroup: 33 # www-data group ID

      containers:
      - name: linkding
        image: sissbruecker/linkding:1.47.0
        ports:
          - containerPort: 9090
        envFrom:
          - configMapRef:
              name: linkding-configmap # settings, per environment
          - secretRef:
              name: linkding-container-env # credentials, SOPS-encrypted

        securityContext:
          allowPrivilegeEscalation: false

        volumeMounts:
          - mountPath: /etc/linkding/data
            name: linkding-data

      - name: linkding-tasks
        image: sissbruecker/linkding:1.47.0
        command: ["python", "manage.py", "run_huey", "-f"]
        envFrom:
          - configMapRef:
              name: linkding-configmap
        securityContext:
          allowPrivilegeEscalation: false
        volumeMounts:
          - mountPath: /etc/linkding/data
            name: linkding-data

      volumes:
        - name: linkding-data
          persistentVolumeClaim:
            claimName: linkding-data-pvc
