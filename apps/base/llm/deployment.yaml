apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-server
  labels:
    app: model-server
spec:
  replicas: 1
  strategy:
    type: Recreate # one ReadWriteOnce volume, so the old pod must let go before the new one starts
  selector:
    matchLabels:
      app: model-server
  template:
    metadata:
      labels:
        app: model-server
        tier: model # shared by both model servers, for the NetworkPolicy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001 # lets the download step write to the volume
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          # Runs on either node. The amd64 node is faster, so prefer it
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: ["amd64"]
      initContainers:
        # Downloads the model once, and stops the pod if the file isn't the pinned one
        - name: fetch-model
          image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
          command: ["sh", "/scripts/fetch-model.sh"]
          envFrom:
            - configMapRef:
                name: model-settings
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: models
              mountPath: /models
            - name: scripts
              mountPath: /scripts
              readOnly: true
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server-b12182@sha256:6d581c788abba2dfa23ff78dba37ea0abfc7d838c49bcc98f4be2103df9772b3
          args:
            - --model
            - /models/$(MODEL_FILE)
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --metrics # Prometheus metrics on /metrics
            - --ctx-size
            - "4096"
            - --threads
            - "4"
          envFrom:
            - configMapRef:
                name: model-settings
          ports:
            - name: http
              containerPort: 8080
          # /health answers 503 while the model loads, and 200 once it's ready
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: models
        - name: scripts
          configMap:
            name: fetch-model-script
