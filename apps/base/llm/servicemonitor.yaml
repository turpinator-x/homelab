apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: model-server
  labels:
    release: kube-prometheus-stack # the label this Prometheus looks for
spec:
  selector:
    matchExpressions:
      - key: app
        operator: In
        values: ["model-server", "model-server-backup"]
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gateway
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: gateway
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
