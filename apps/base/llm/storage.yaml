apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models
spec:
  # A cache, not data: the model can always be downloaded again, so the default Delete policy is fine
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models-backup
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
