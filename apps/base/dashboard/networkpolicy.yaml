apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dashboard
spec:
  podSelector:
    matchLabels:
      app: dashboard
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only this namespace's cloudflared pods may connect, and only to the app port.
    - from:
        - podSelector:
            matchLabels:
              app: cloudflared
      ports:
        - port: http
  egress:
    # DNS, to resolve the Prometheus Service name.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Prometheus, and nothing else: no internet, no other apps.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9090
