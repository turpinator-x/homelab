# Nightly encrypted backups of PostgreSQL and the case files (docs/blockone-crypto-tax.md, "Backups and restore").
#
#   03:30 blockone-backup (minisrv01): pg_dump + a tar of blockone-data, encrypted by rclone's crypt remote and
#         uploaded to a Cloudflare R2 bucket under YYYY/MM/DD (UTC). The nightly run then prunes by
#         backup-prune.sh: nightly sets after 35 days, pre-release sets (below) after 7, never the newest sets.
#   04:30 blockone-backup-mirror (pisrv01): copies the still-encrypted R2 objects onto pisrv01's own volume, prunes
#         it by the same rules, and proves last night's backup decrypts and reads (pg_restore --list, tar -t).
#   Pre-release sets: promote.sh runs a Job from this CronJob named bk-predeploy-* (and the mirror one, bkv-*).
#         rollback.sh's bk-prerollback-* sets are NOT tagged and keep the nightly 35 days. A bk-predeploy run tags its set with a blockone-predeploy-<stamp>.marker file, and
#         does not prune, so a retention problem can never block a release. Nothing else about the set differs, so
#         the log lines promote.sh reads are unchanged.
#   The plain dump and tar are written only to memory-backed emptyDirs (nothing unencrypted reaches a disk).
#
# rclone is configured by environment variables only (RCLONE_CONFIG_<REMOTE>_<OPTION>), no config file. The
# R2 keys and the crypt passwords come from the SOPS Secrets blockone-backup and blockone-backup-mirror (overlay).
# Losing the crypt passwords makes every backup unreadable: they are kept in the password manager too.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: blockone-backup
  labels:
    app: blockone-backup
spec:
  schedule: "30 3 * * *"
  timeZone: America/Los_Angeles
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600 # a run missed by more than an hour (node down) waits for the next night
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # A failed prune/size step (exit 17 from the upload container, after a verified upload) fails the Job without
      # the retry, which would otherwise upload a second full set. Any other failure is retried once, as before.
      podFailurePolicy:
        rules:
          - action: FailJob
            onExitCodes:
              containerName: upload
              operator: In
              values: [17]
      activeDeadlineSeconds: 2700 # 45 minutes, well before the mirror's run
      template:
        metadata:
          labels:
            app: blockone-backup # may reach PostgreSQL (networkpolicy.yaml)
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          nodeSelector:
            kubernetes.io/hostname: minisrv01 # blockone-data is a node-local volume
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001 # the app's uid, so the tar can read every case file
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # 1. Tar the case files FIRST, then dump the database: the app's agreement anchor (on this volume)
            #    must never be ahead of the database in a backup, or a restore shows a false tamper alarm
            #    (app docs/agreements.md). Tar the whole case-files volume, read-only. Nothing is left out: the per-case caches feed the
            #    "cached answers only" steps, so they are part of a reproducible result (only the copies a restore
            #    set aside, .pre-restore-* and .restoring-*, are skipped). GNU tar exits 1 if a file changed
            #    while it was read (a job writing at 03:30): the run fails and alerts rather than keep a torn copy.
            - name: archive
              image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  stamp=$(date -u +%Y%m%dT%H%M%SZ)
                  date -u +%Y/%m/%d > /work/day
                  echo "$stamp" > /work/stamp
                  # A pre-release set (started by promote.sh: bk-predeploy-*) is tagged so that retention can tell it
                  # from a nightly one. Any other Job name is treated as nightly: the safe direction is keeping more.
                  # bk-prerollback-* (rollback.sh) is deliberately NOT tagged: the app tells the owner it holds the only
                  # copy of dropped agreement signatures, kept for the full 35 days.
                  case "$JOB_NAME" in
                    bk-predeploy-*) printf 'kind=predeploy\njob=%s\n' "$JOB_NAME" > "/work/blockone-predeploy-$stamp.marker" ;;
                    *) ;;
                  esac
                  tar -C /data --exclude=./lost+found --exclude='./.pre-restore-*' --exclude='./.restoring-*' \
                    -czf "/work/blockone-data-$stamp.tar.gz.partial" .
                  tar -tzf "/work/blockone-data-$stamp.tar.gz.partial" > /dev/null
                  mv "/work/blockone-data-$stamp.tar.gz.partial" "/work/blockone-data-$stamp.tar.gz"
                  ls -l /work
                  # work-volume use against its limit (the tmpfs is sized to the volume's sizeLimit)
                  df -Pk /work | awk 'NR == 2 { pct = int($3 * 100 / $2); printf "work: %s used %d of %d MiB (%d%%)\n", (pct >= 70 ? "WARNING" : "ok"), $3 / 1024, $2 / 1024, pct }'
              env:
                - name: HOME
                  value: /tmp
                - name: JOB_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.labels['job-name'] # set by the Job controller; the script fails without it
              # The archive is written into a memory-backed volume, and those pages are charged to the container that
              # wrote them: the limit is the volume's 3 Gi plus room for tar and gzip.
              resources:
                requests:
                  cpu: 20m
                  memory: 1Gi
                limits:
                  memory: 3584Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: work
                  mountPath: /work
                - name: tmp
                  mountPath: /tmp
            # 2. Dump the database in PostgreSQL's custom format (compressed; pg_restore can pick tables from it).
            #    The .partial name means a dump that died halfway is never uploaded.
            - name: dump
              image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  stamp=$(cat /work/stamp)
                  # A new pod's NetworkPolicy allow rules take a few seconds to reach the node (kube-router): until
                  # then Postgres refuses the connection. Wait for it (up to 2 minutes), then fail loudly.
                  for i in $(seq 1 60); do
                    if pg_isready -q -h blockone-postgres -U blockone -d blockone; then break; fi
                    if [ "$i" -eq 60 ]; then echo "Postgres not reachable after 120s" >&2; exit 1; fi
                    sleep 2
                  done
                  pg_dump -h blockone-postgres -U blockone -d blockone -Fc -f "/work/blockone-db-$stamp.dump.partial"
                  pg_restore --list "/work/blockone-db-$stamp.dump.partial" > /dev/null # readable before it's kept
                  mv "/work/blockone-db-$stamp.dump.partial" "/work/blockone-db-$stamp.dump"
                  ls -l /work
                  df -Pk /work | awk 'NR == 2 { pct = int($3 * 100 / $2); printf "work: %s used %d of %d MiB (%d%%)\n", (pct >= 70 ? "WARNING" : "ok"), $3 / 1024, $2 / 1024, pct }'
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: blockone-db
                      key: password
                - name: PGCONNECT_TIMEOUT
                  value: "10"
                - name: HOME
                  value: /tmp
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: tmp
                  mountPath: /tmp
          containers:
            # 3. Encrypt and upload, check the upload against the local files, then (nightly run only) apply the
            #    retention in backup-prune.sh and log the bucket's size against R2's 10 GB free allowance (size: WARNING at 75%).
            - name: upload
              image: rclone/rclone:1.76.0@sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -euo pipefail
                  day=$(cat /work/day)
                  rclone copy /work "backup:$day" --include '*.dump' --include '*.tar.gz' --include '*.marker' --stats-one-line -v
                  rclone cryptcheck /work "backup:$day" --include '*.dump' --include '*.tar.gz' --one-way
                  # Retention only in the nightly run (the CronJob names its Jobs blockone-backup-<time>). A
                  # pre-release run stops here: a retention refusal must never fail a release's backup.
                  # A failure here must not re-run the upload (podFailurePolicy: exit 17 fails the Job without the
                  # retry), and must not skip the size line or the final listing: the exit code is decided at the end.
                  step_rc=0
                  case "$JOB_NAME" in
                    blockone-backup-*)
                      /bin/sh /scripts/backup-prune.sh backup: || { echo "prune: FAILED (exit $?)" >&2; step_rc=17; }
                      /bin/sh /scripts/backup-size-report.sh backup: 10000000000 "R2 bucket" || { echo "size: FAILED" >&2; step_rc=17; }
                      ;;
                    *) echo "prune: skipped for job $JOB_NAME (only the nightly run prunes)" ;;
                  esac
                  # the final listing is informational, but its failure must not hide a prune failure's exit 17
                  rclone lsf -R --files-only backup: > /tmp/final-listing || { echo "final listing FAILED" >&2; step_rc=17; }
                  sort /tmp/final-listing | tail -n 4
                  exit "$step_rc"
              env:
                - name: JOB_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.labels['job-name']
                - name: R2_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: blockone-backup
                      key: R2_ENDPOINT
                - name: R2_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: blockone-backup
                      key: R2_BUCKET
                # "r2": the bucket itself (S3 API). Its objects are only ever ciphertext.
                - name: RCLONE_CONFIG_R2_TYPE
                  value: s3
                - name: RCLONE_CONFIG_R2_PROVIDER
                  value: Cloudflare
                - name: RCLONE_CONFIG_R2_ENDPOINT
                  value: $(R2_ENDPOINT)
                - name: RCLONE_CONFIG_R2_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: blockone-backup
                      key: R2_ACCESS_KEY_ID
                - name: RCLONE_CONFIG_R2_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: blockone-backup
                      key: R2_SECRET_ACCESS_KEY
                - name: RCLONE_CONFIG_R2_NO_CHECK_BUCKET
                  value: "true" # the token is limited to one bucket and can't list or create buckets
                # "backup": crypt over r2:<bucket>/blockone. File and folder names and contents are encrypted
                # (NaCl secretbox: a changed byte fails to decrypt instead of restoring wrong data).
                - name: RCLONE_CONFIG_BACKUP_TYPE
                  value: crypt
                - name: RCLONE_CONFIG_BACKUP_REMOTE
                  value: r2:$(R2_BUCKET)/blockone
                - name: RCLONE_CONFIG_BACKUP_FILENAME_ENCRYPTION
                  value: standard
                - name: RCLONE_CONFIG_BACKUP_DIRECTORY_NAME_ENCRYPTION
                  value: "true"
                - name: RCLONE_CONFIG_BACKUP_PASSWORD # rclone obscure'd, as rclone expects in config
                  valueFrom:
                    secretKeyRef:
                      name: blockone-backup
                      key: RCLONE_CRYPT_PASSWORD
                - name: RCLONE_CONFIG_BACKUP_PASSWORD2 # the salt; obscure'd too
                  valueFrom:
                    secretKeyRef:
                      name: blockone-backup
                      key: RCLONE_CRYPT_PASSWORD2
                - name: HOME
                  value: /tmp
                - name: XDG_CONFIG_HOME
                  value: /tmp/.config
                - name: RCLONE_CACHE_DIR
                  value: /tmp/.cache
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: work
                  mountPath: /work
                  readOnly: true
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: blockone-data
                readOnly: true
            - name: work
              # Memory-backed: the plain dump and archive never touch a disk. Measured 2026-11-19: a 452 MB archive
              # and a 125 KB dump. The archive grew in four discrete steps of about 88 MiB (11-16 to 11-19, roughly
              # 1,500 to 2,000 files each): cause unknown, owner check: du -sk /data/cases/* from the API pod. The
              # 7-day prune does not shrink it. The jobs log "work: used X of Y MiB" (WARNING from 70%). If a set
              # outgrows the volume, tar fails with "No space left on device" and the run fails loudly; raise this
              # and the archive container's limit together (limit = sizeLimit + 512Mi).
              emptyDir:
                medium: Memory
                sizeLimit: 3Gi
            - name: scripts
              configMap:
                name: blockone-backup-scripts
                defaultMode: 0444
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
---
# The second copy lives on the other node, so one disk (or one node) failing never takes both. It holds the R2
# objects as they are, still encrypted.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: blockone-backup-mirror
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled # keep the backups if the app is turned off
spec:
  storageClassName: local-path-retain
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: blockone-backup-mirror
  labels:
    app: blockone-backup-mirror
spec:
  schedule: "30 4 * * *" # an hour after blockone-backup
  timeZone: America/Los_Angeles
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 2700
      template:
        metadata:
          labels:
            app: blockone-backup-mirror
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          nodeSelector:
            kubernetes.io/hostname: pisrv01 # the other node: its volume is the second copy
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # 1. Copy, never sync: if the bucket is emptied (a leaked key, a mistake), the deletion must not
            #    reach this copy. --immutable: backups never change once written, so an object in R2 that no
            #    longer matches the copy here (tampering, corruption) fails the run instead of overwriting the
            #    good copy. Retention here is by age on its own. Then decrypt last night's pair into an emptyDir
            #    through a crypt remote over the local copy, which also proves the local copy decrypts.
            - name: mirror
              image: rclone/rclone:1.76.0@sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -euo pipefail
                  rclone copy "r2:$R2_BUCKET/blockone" /mirror/blockone --immutable --stats-one-line -v
                  # Same retention as R2 (backup-prune.sh), but only in the nightly run (bkv-* Jobs from promote.sh
                  # skip it: a retention refusal must not block a release). The nightly run also logs the volume against its 120 Gi budget (the PVC is nominally 10 Gi: local-path does not enforce size, and the class cannot expand a bound PVC).
                  case "$JOB_NAME" in
                    blockone-backup-mirror-*)
                      # A failed prune must not skip the decrypt check below: it is recorded, and the verify
                      # container fails the Job after it has printed its result.
                      /bin/sh /scripts/backup-prune.sh local: || { echo "prune: FAILED (exit $?)" >&2; echo prune > /verify/step-failed; }
                      rclone rmdirs /mirror/blockone --leave-root
                      /bin/sh /scripts/backup-size-report.sh /mirror/blockone 128849018880 "mirror volume" || { echo "size: FAILED" >&2; echo size > /verify/step-failed; }
                      ;;
                    *) echo "prune: skipped for job $JOB_NAME (only the nightly run prunes)" ;;
                  esac
                  dump=$(rclone lsf -R --files-only --max-age 30h --include '*.dump' local: | sort | tail -n 1)
                  if [ -z "$dump" ]; then
                    echo "FAIL: no database dump newer than 30 hours in the mirror" >&2
                    exit 1
                  fi
                  data="$(dirname "$dump")/$(basename "$dump" .dump | sed 's/^blockone-db-/blockone-data-/').tar.gz"
                  echo "verifying $dump and $data"
                  rclone copyto "local:$dump" /verify/blockone-db.dump
                  # The archive is streamed through tar (decrypt, gunzip and read every entry, so a truncated or
                  # corrupt archive fails) and never stored: its size no longer matters. pipefail makes a failure of
                  # rclone (decrypt error, missing object) fail the pipeline, not just tar's exit status.
                  files=$(rclone cat "local:$data" | tar -tz | wc -l) || {
                    echo "FAIL: the case-files archive $data did not decrypt and list cleanly" >&2
                    exit 1
                  }
                  if [ "$files" -eq 0 ]; then
                    echo "FAIL: the case-files archive $data lists no entries" >&2
                    exit 1
                  fi
                  echo "$files" > /verify/files-count
                  df -Pk /verify | awk 'NR == 2 { pct = int($3 * 100 / $2); printf "work: %s used %d of %d MiB (%d%%)\n", (pct >= 70 ? "WARNING" : "ok"), $3 / 1024, $2 / 1024, pct }'
                  echo "$dump" > /verify/name
              env:
                - name: JOB_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.labels['job-name']
                - name: R2_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: blockone-backup-mirror
                      key: R2_ENDPOINT
                - name: R2_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: blockone-backup-mirror
                      key: R2_BUCKET
                - name: RCLONE_CONFIG_R2_TYPE
                  value: s3
                - name: RCLONE_CONFIG_R2_PROVIDER
                  value: Cloudflare
                - name: RCLONE_CONFIG_R2_ENDPOINT
                  value: $(R2_ENDPOINT)
                - name: RCLONE_CONFIG_R2_ACCESS_KEY_ID # a read-only token: this pod can't change the bucket
                  valueFrom:
                    secretKeyRef:
                      name: blockone-backup-mirror
                      key: R2_ACCESS_KEY_ID
                - name: RCLONE_CONFIG_R2_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: blockone-backup-mirror
                      key: R2_SECRET_ACCESS_KEY
                - name: RCLONE_CONFIG_R2_NO_CHECK_BUCKET
                  value: "true"
                # "local": crypt over the local copy, same passwords as the upload's
                - name: RCLONE_CONFIG_LOCAL_TYPE
                  value: crypt
                - name: RCLONE_CONFIG_LOCAL_REMOTE
                  value: /mirror/blockone
                - name: RCLONE_CONFIG_LOCAL_FILENAME_ENCRYPTION
                  value: standard
                - name: RCLONE_CONFIG_LOCAL_DIRECTORY_NAME_ENCRYPTION
                  value: "true"
                - name: RCLONE_CONFIG_LOCAL_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: blockone-backup-mirror
                      key: RCLONE_CRYPT_PASSWORD
                - name: RCLONE_CONFIG_LOCAL_PASSWORD2
                  valueFrom:
                    secretKeyRef:
                      name: blockone-backup-mirror
                      key: RCLONE_CRYPT_PASSWORD2
                - name: HOME
                  value: /tmp
                - name: XDG_CONFIG_HOME
                  value: /tmp/.config
                - name: RCLONE_CACHE_DIR
                  value: /tmp/.cache
              # The decrypted dump goes into the memory-backed verify volume, and those pages are charged to this
              # container: limit = the volume's 2 Gi plus room for rclone. The case-files archive is streamed, not stored.
              resources:
                requests:
                  cpu: 20m
                  memory: 1Gi
                limits:
                  memory: 2560Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: mirror
                  mountPath: /mirror
                - name: verify
                  mountPath: /verify
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          containers:
            # 2. Prove the decrypted files are a usable dump and a readable archive. An application database
            #    always has tables (alembic_version at least), so a dump without any table data fails too.
            - name: verify
              image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  echo "checking $(cat /verify/name)"
                  pg_restore --list /verify/blockone-db.dump > /tmp/list
                  if ! grep -q ' TABLE DATA ' /tmp/list; then
                    echo "FAIL: the dump has no table data" >&2
                    exit 1
                  fi
                  tables=$(grep -c ' TABLE DATA ' /tmp/list)
                  files=$(cat /verify/files-count) # the archive was streamed and read in full by the mirror container
                  echo "OK: database dump lists $tables tables with data; case-files archive lists $files entries"
                  if [ -e /verify/step-failed ]; then
                    echo "FAIL: the nightly $(cat /verify/step-failed) step failed (see the mirror container's log)" >&2
                    exit 1
                  fi
              env:
                - name: HOME
                  value: /tmp
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: verify
                  mountPath: /verify
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: mirror
              persistentVolumeClaim:
                claimName: blockone-backup-mirror
            - name: verify
              # Memory-backed (pisrv01 has 8 GB, about 5.2 GB available at the 7-day minimum): the decrypted dump never
              # touches the Pi's SD card. Only the database dump lands here (the case-files archive is streamed through
              # tar, so its size is irrelevant); if the dump ever passes 2 Gi the check fails while the backup still
              # succeeds. Raise it with the Pi's headroom in view.
              emptyDir:
                medium: Memory
                sizeLimit: 2Gi
            - name: scripts
              configMap:
                name: blockone-backup-scripts
                defaultMode: 0444
            - name: tmp
              # also memory-backed: the verify step lists the dump's contents into it
              emptyDir:
                medium: Memory
                sizeLimit: 64Mi
