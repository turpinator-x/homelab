apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - storage.yaml
  - postgres.yaml
  - api.yaml
  - worker.yaml
  - networkpolicy.yaml
  - backup.yaml
  - backup-alerts.yaml
  - storage-alerts.yaml
  - storage-report.yaml
  - storage-report-alerts.yaml
  - servicemonitor.yaml
  - app-alerts.yaml
configMapGenerator:
  # The backup jobs' retention and size-report scripts (tested by scripts/test-backup-prune.sh)
  - name: blockone-backup-scripts
    files:
      - backup-prune.sh
      - backup-size-report.sh
  # The weekly storage report's script (tested by scripts/test-storage-report.sh)
  - name: blockone-storage-report-script
    files:
      - storage-report.sh
  # Settings that aren't secret (src/nftcb/web/settings.py in the app repo). Secrets come from the staging overlay.
  - name: blockone-settings
    literals:
      - BLOCKONE_WEB_ENVIRONMENT=production
      - BLOCKONE_WEB_AUTH_MODE=cloudflare
      - BLOCKONE_WEB_DATA_ROOT=/data/cases
      # Admin -> Agreements (who signed what, export, roles). Must be the Cloudflare Access sign-in email.
      - BLOCKONE_WEB_ADMIN_EMAILS=jarrodturpin@blockoneglobal.com
      - NFTCB_DATA_DIR=/data/engine
      - HOME=/tmp
      # Prometheus /metrics (aggregate ops metrics, no user data) on its own pod-internal port. Never behind the tunnel:
      # cloudflare.yaml points at the http port (8000) only. Scraped by servicemonitor.yaml; networkpolicy.yaml
      # admits the monitoring namespace to this port and nothing else
      - BLOCKONE_WEB_METRICS_PORT=9464
      # The API trusts X-Forwarded-* only from the pod network (k3s's default pod range), where cloudflared runs
      - FORWARDED_ALLOW_IPS=10.42.0.0/16
