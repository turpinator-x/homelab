apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - storage.yaml
  - postgres.yaml
  - api.yaml
  - worker.yaml
  - networkpolicy.yaml
configMapGenerator:
  # Settings that aren't secret (src/nftcb/web/settings.py in the app repo). Secrets come from the staging overlay.
  - name: blockone-settings
    literals:
      - BLOCKONE_WEB_ENVIRONMENT=production
      - BLOCKONE_WEB_AUTH_MODE=cloudflare
      - BLOCKONE_WEB_DATA_ROOT=/data/cases
      - NFTCB_DATA_DIR=/data/engine
      - HOME=/tmp
      # The API trusts X-Forwarded-* only from the pod network (k3s's default pod range), where cloudflared runs
      - FORWARDED_ALLOW_IPS=10.42.0.0/16
