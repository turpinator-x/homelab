# promtool test rules for storage-alerts.yaml (node disk only: see the rule file for why there are no volume rules)
# promtool test rules for storage-alerts.yaml (run: scripts/test-blockone-alerts.sh). Fill is 1 - avail/size, so
# 80 GB used of 100 GB is 0.80: a warning; 95 is critical; 70 is quiet. The two levels never fire together.
rule_files:
  - ../storage-alerts.rules.yaml
evaluation_interval: 1m
tests:
  - name: node disk 80% full warns after 15 minutes, not critical
    interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{instance="192.168.1.224:9100", mountpoint="/", fstype="ext4"}'
        values: '100000000000x40'
      - series: 'node_filesystem_avail_bytes{instance="192.168.1.224:9100", mountpoint="/", fstype="ext4"}'
        values: '20000000000x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: BlockOneNodeDiskWarning
        exp_alerts: []
      - eval_time: 20m
        alertname: BlockOneNodeDiskWarning
        exp_alerts:
          - exp_labels: {severity: warning, instance: "192.168.1.224:9100", mountpoint: /, fstype: ext4}
            exp_annotations:
              summary: "Disk on node 192.168.1.224:9100 is 80% full"
              description: "Free space on / is under 25%. minisrv01 holds the case files, PostgreSQL and the backup work; pisrv01 holds the backup mirror. Check: kubectl --context homelab -n monitoring port-forward svc/kube-prometheus-stack-prometheus 9090, then node_filesystem_avail_bytes."
              runbook: docs/blockone-crypto-tax.md (Storage and alerts)
      - eval_time: 30m
        alertname: BlockOneNodeDiskCritical
        exp_alerts: []
  - name: node disk 70% full stays quiet
    interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{instance="192.168.1.158:9100", mountpoint="/", fstype="ext4"}'
        values: '100000000000x40'
      - series: 'node_filesystem_avail_bytes{instance="192.168.1.158:9100", mountpoint="/", fstype="ext4"}'
        values: '30000000000x40'
    alert_rule_test:
      - {eval_time: 35m, alertname: BlockOneNodeDiskWarning, exp_alerts: []}
      - {eval_time: 35m, alertname: BlockOneNodeDiskCritical, exp_alerts: []}
  - name: node disk 95% full is critical after 5 minutes and not also a warning
    interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{instance="192.168.1.158:9100", mountpoint="/", fstype="ext4"}'
        values: '100000000000x40'
      - series: 'node_filesystem_avail_bytes{instance="192.168.1.158:9100", mountpoint="/", fstype="ext4"}'
        values: '5000000000x40'
    alert_rule_test:
      - {eval_time: 3m, alertname: BlockOneNodeDiskCritical, exp_alerts: []}
      - eval_time: 10m
        alertname: BlockOneNodeDiskCritical
        exp_alerts:
          - exp_labels: {severity: critical, instance: "192.168.1.158:9100", mountpoint: /, fstype: ext4}
            exp_annotations:
              summary: "Disk on node 192.168.1.158:9100 is 95% full"
              description: "Free space on / is under 10%: new backups, uploads and the database can start failing. Free space now."
              runbook: docs/blockone-crypto-tax.md (Storage and alerts)
      - {eval_time: 30m, alertname: BlockOneNodeDiskWarning, exp_alerts: []}
  - name: tmpfs and other filesystems are ignored
    interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{instance="192.168.1.158:9100", mountpoint="/run", fstype="tmpfs"}'
        values: '100x40'
      - series: 'node_filesystem_avail_bytes{instance="192.168.1.158:9100", mountpoint="/run", fstype="tmpfs"}'
        values: '1x40'
    alert_rule_test:
      - {eval_time: 35m, alertname: BlockOneNodeDiskCritical, exp_alerts: []}
  - name: only the root mountpoint on a real filesystem counts
    interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{instance="192.168.1.158:9100", mountpoint="/boot", fstype="ext4"}'
        values: '100x40'
      - series: 'node_filesystem_avail_bytes{instance="192.168.1.158:9100", mountpoint="/boot", fstype="ext4"}'
        values: '1x40'
      - series: 'node_filesystem_size_bytes{instance="192.168.1.158:9100", mountpoint="/", fstype="overlay"}'
        values: '100x40'
      - series: 'node_filesystem_avail_bytes{instance="192.168.1.158:9100", mountpoint="/", fstype="overlay"}'
        values: '1x40'
    alert_rule_test:
      - {eval_time: 35m, alertname: BlockOneNodeDiskCritical, exp_alerts: []}
      - {eval_time: 35m, alertname: BlockOneNodeDiskWarning, exp_alerts: []}
  - name: exactly 75% and exactly 90% do not fire (the thresholds are strict)
    interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{instance="a:9100", mountpoint="/", fstype="ext4"}'
        values: '100x40'
      - series: 'node_filesystem_avail_bytes{instance="a:9100", mountpoint="/", fstype="ext4"}'
        values: '25x40'
      - series: 'node_filesystem_size_bytes{instance="b:9100", mountpoint="/", fstype="ext4"}'
        values: '100x40'
      - series: 'node_filesystem_avail_bytes{instance="b:9100", mountpoint="/", fstype="ext4"}'
        values: '10x40'
    alert_rule_test:
      - {eval_time: 35m, alertname: BlockOneNodeDiskCritical, exp_alerts: []}
      - eval_time: 35m
        alertname: BlockOneNodeDiskWarning
        exp_alerts:
          - exp_labels: {severity: warning, instance: "b:9100", mountpoint: /, fstype: ext4}
            exp_annotations:
              summary: "Disk on node b:9100 is 90% full"
              description: "Free space on / is under 25%. minisrv01 holds the case files, PostgreSQL and the backup work; pisrv01 holds the backup mirror. Check: kubectl --context homelab -n monitoring port-forward svc/kube-prometheus-stack-prometheus 9090, then node_filesystem_avail_bytes."
              runbook: docs/blockone-crypto-tax.md (Storage and alerts)
  - name: just above 75% warns, just below stays quiet (0.755 vs 0.745), exactly on the for-durations
    interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{instance="hi:9100", mountpoint="/", fstype="ext4"}'
        values: '1000x40'
      - series: 'node_filesystem_avail_bytes{instance="hi:9100", mountpoint="/", fstype="ext4"}'
        values: '245x40'
      - series: 'node_filesystem_size_bytes{instance="lo:9100", mountpoint="/", fstype="ext4"}'
        values: '1000x40'
      - series: 'node_filesystem_avail_bytes{instance="lo:9100", mountpoint="/", fstype="ext4"}'
        values: '255x40'
    alert_rule_test:
      - {eval_time: 14m, alertname: BlockOneNodeDiskWarning, exp_alerts: []}
      - eval_time: 15m
        alertname: BlockOneNodeDiskWarning
        exp_alerts:
          - exp_labels: {severity: warning, instance: "hi:9100", mountpoint: /, fstype: ext4}
            exp_annotations:
              summary: "Disk on node hi:9100 is 75.5% full"
              description: "Free space on / is under 25%. minisrv01 holds the case files, PostgreSQL and the backup work; pisrv01 holds the backup mirror. Check: kubectl --context homelab -n monitoring port-forward svc/kube-prometheus-stack-prometheus 9090, then node_filesystem_avail_bytes."
              runbook: docs/blockone-crypto-tax.md (Storage and alerts)
  - name: critical fires exactly after 5 minutes, not 4
    interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{instance="c:9100", mountpoint="/", fstype="ext4"}'
        values: '100x40'
      - series: 'node_filesystem_avail_bytes{instance="c:9100", mountpoint="/", fstype="ext4"}'
        values: '5x40'
    alert_rule_test:
      - {eval_time: 4m, alertname: BlockOneNodeDiskCritical, exp_alerts: []}
      - eval_time: 5m
        alertname: BlockOneNodeDiskCritical
        exp_alerts:
          - exp_labels: {severity: critical, instance: "c:9100", mountpoint: /, fstype: ext4}
            exp_annotations:
              summary: "Disk on node c:9100 is 95% full"
              description: "Free space on / is under 10%: new backups, uploads and the database can start failing. Free space now."
              runbook: docs/blockone-crypto-tax.md (Storage and alerts)
