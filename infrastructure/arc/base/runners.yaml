# One runner scale set per repository: GitHub only lets a personal account register runners per repo.
# Each starts at zero runners, makes one ephemeral pod per job, and deletes it when the job ends.
# Workflows opt in with `runs-on: homelab-<repo>`; until then they keep using GitHub's runners.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: gha-runner-scale-set
  namespace: arc-runners
spec:
  interval: 12h
  url: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
  ref:
    tag: "0.15.1"
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: gha-runner-scale-set
  namespace: arc-runners-dind
spec:
  interval: 12h
  url: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
  ref:
    tag: "0.15.1"
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homelab-claims-app
  namespace: arc-runners
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
  values:
    githubConfigUrl: https://github.com/turpinator-x/claims-app
    githubConfigSecret: arc-github-app
    runnerScaleSetName: homelab-claims-app
    minRunners: 0
    maxRunners: 1
    controllerServiceAccount: { namespace: arc-systems, name: arc-gha-rs-controller }
    template:
      spec:
        nodeSelector:
          kubernetes.io/hostname: minisrv01
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:2.338.2
            command: ["/home/runner/run.sh"]
            resources:
              requests: { cpu: 500m, memory: 1Gi }
              limits: { cpu: "3", memory: 6Gi }
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homelab-blockone-devops-ai-journey
  namespace: arc-runners-dind
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
  values:
    githubConfigUrl: https://github.com/turpinator-x/blockone-devops-ai-journey
    githubConfigSecret: arc-github-app
    runnerScaleSetName: homelab-blockone-devops-ai-journey
    minRunners: 0
    maxRunners: 1
    controllerServiceAccount: { namespace: arc-systems, name: arc-gha-rs-controller }
    # Docker-in-Docker, written out in full instead of `containerMode: dind` so the dind sidecar can be
    # configured and pinned. The pod network's MTU is 1450 (flannel VXLAN), but Docker's bridge defaults
    # to 1500, so big packets from job containers were dropped and downloads hung. dockerd takes the
    # pod's MTU, and TCP MSS clamping covers containers nested further down (Docker inside a job container).
    template:
      spec:
        nodeSelector:
          kubernetes.io/hostname: minisrv01
        initContainers:
          - name: init-dind-externals
            image: ghcr.io/actions/actions-runner:2.338.2
            command: ["cp", "-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
            volumeMounts:
              - { name: dind-externals, mountPath: /home/runner/tmpDir }
            resources:
              requests: { cpu: 100m, memory: 128Mi }
              limits: { cpu: 500m, memory: 512Mi }
          - name: dind
            image: docker:29.5.2-dind  # held below 29.6: see docs/github-runners.md (umask)
            restartPolicy: Always
            command: ["/bin/sh", "-ec"]
            args:
              - |
                mtu=$(cat /sys/class/net/eth0/mtu)
                iptables -t mangle -A FORWARD -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu
                exec dockerd-entrypoint.sh dockerd --host=unix:///var/run/docker.sock --group=123 --mtu="$mtu"
            # Docker builds and the jobs' containers run here, so dind gets most of the pod's share.
            # Runner + dind = 4 CPU / 7Gi, so both dind scale sets fit the namespace quota (8 CPU / 14Gi).
            resources:
              requests: { cpu: 500m, memory: 1Gi }
              limits: { cpu: "3", memory: 5Gi }
            securityContext:
              privileged: true
            startupProbe:
              exec: { command: ["docker", "info"] }
              failureThreshold: 24
              periodSeconds: 5
            volumeMounts:
              - { name: work, mountPath: /home/runner/_work }
              - { name: dind-sock, mountPath: /var/run }
              - { name: dind-externals, mountPath: /home/runner/externals }
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:2.338.2
            command: ["/home/runner/run.sh"]
            env:
              - { name: DOCKER_HOST, value: unix:///var/run/docker.sock }
              - { name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS, value: "120" }
            resources:
              requests: { cpu: 250m, memory: 512Mi }
              limits: { cpu: "1", memory: 2Gi }
            volumeMounts:
              - { name: work, mountPath: /home/runner/_work }
              - { name: dind-sock, mountPath: /var/run }
        volumes:
          - { name: work, emptyDir: {} }
          - { name: dind-sock, emptyDir: {} }
          - { name: dind-externals, emptyDir: {} }
---
