# Caps so CI can never starve the model platform or other apps on minisrv01 (16 cores, 24 GB).
# The LimitRange gives every container (including the chart's dind sidecar) default limits; the quota caps each namespace.
apiVersion: v1
kind: LimitRange
metadata:
  name: runner-defaults
  namespace: arc-runners
spec:
  limits:
    - type: Container
      default: { cpu: "3", memory: 6Gi }
      defaultRequest: { cpu: 250m, memory: 512Mi }
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: runner-cap
  namespace: arc-runners
spec:
  hard: { limits.cpu: "4", limits.memory: 8Gi, pods: "3" }
---
apiVersion: v1
kind: LimitRange
metadata:
  name: runner-defaults
  namespace: arc-runners-dind
spec:
  limits:
    - type: Container
      default: { cpu: "3", memory: 6Gi }
      defaultRequest: { cpu: 250m, memory: 512Mi }
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: runner-cap
  namespace: arc-runners-dind
spec:
  hard: { limits.cpu: "8", limits.memory: 14Gi, pods: "6" }
