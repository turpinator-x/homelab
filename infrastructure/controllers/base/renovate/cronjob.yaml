apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
spec:
  schedule: "@hourly"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
          containers:
            - name: renovate
              image: renovate/renovate:44.173.0
              args:
                - turpinator-x/homelab
              envFrom:
                - configMapRef:
                    name: renovate-configmap
                - secretRef:
                    name: renovate-container-env
              securityContext:
                allowPrivilegeEscalation: false
