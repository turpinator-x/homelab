# Self-hosted GitHub Actions runners (Actions Runner Controller). Its own Kustomization so a runner
# problem can never hold up Renovate or the other infrastructure.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: arc
  namespace: flux-system
spec:
  interval: 1m0s
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/arc/staging
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
