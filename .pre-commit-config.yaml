default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.3
    hooks:
      - id: commitizen
        stages: [commit-msg]
  - repo: local
    hooks:
      - id: block-plaintext-secrets
        name: block plaintext secrets
        entry: .githooks/pre-commit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
